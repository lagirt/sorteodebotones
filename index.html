<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elige tu destino</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fondo animado de océano con barcos piratas navegando -->
  <div class="ocean-scene" aria-hidden="true">
    <div class="moon"></div>

    <!-- Barco Pirata 1 (navega de izquierda a derecha) -->
    <div class="pirate-ship ship-1">
      <div class="ship-bob">
        <svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
          <!-- Mástiles -->
          <rect x="65" y="25" width="4" height="105" fill="#4a2c11" />
          <rect x="115" y="12" width="5" height="118" fill="#4a2c11" />
          <rect x="160" y="35" width="4" height="95" fill="#4a2c11" />
          <!-- Banderín pirata superior -->
          <polygon points="117,12 145,18 117,25" fill="#111827" />
          <!-- Velas oscuras piratas -->
          <path d="M 45 40 Q 75 55 67 105 L 40 100 Q 52 70 45 40 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
          <path d="M 85 28 Q 135 50 118 110 L 80 105 Q 98 68 85 28 Z" fill="#111827" stroke="#0f172a" stroke-width="2" />
          <path d="M 140 45 Q 175 62 162 108 L 136 104 Q 148 75 140 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
          <!-- Símbolo calavera en la vela mayor -->
          <circle cx="104" cy="65" r="8" fill="#f8fafc" />
          <rect x="100" y="71" width="8" height="5" rx="1" fill="#f8fafc" />
          <circle cx="101" cy="64" r="2" fill="#111827" />
          <circle cx="107" cy="64" r="2" fill="#111827" />
          <line x1="92" y1="80" x2="116" y2="54" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
          <line x1="92" y1="54" x2="116" y2="80" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
          <!-- Casco de madera del barco -->
          <path d="M 20 120 L 195 120 L 175 155 Q 110 165 40 155 Z" fill="#5c3317" stroke="#3b1e08" stroke-width="3" />
          <path d="M 15 110 L 60 120 L 25 130 Z" fill="#7c4722" />
          <path d="M 195 120 L 218 105 L 185 130 Z" fill="#4a2c11" />
          <!-- Cañones / troneras -->
          <circle cx="65" cy="136" r="4" fill="#111827" />
          <circle cx="90" cy="137" r="4" fill="#111827" />
          <circle cx="115" cy="137" r="4" fill="#111827" />
          <circle cx="140" cy="136" r="4" fill="#111827" />
          <circle cx="162" cy="135" r="4" fill="#111827" />
        </svg>
      </div>
    </div>

    <!-- Barco Pirata 2 (navega de derecha a izquierda al fondo) -->
    <div class="pirate-ship ship-2">
      <div class="ship-bob">
        <svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
          <g transform="scale(-1, 1) translate(-220, 0)">
            <rect x="65" y="25" width="4" height="105" fill="#3b1e08" />
            <rect x="115" y="12" width="5" height="118" fill="#3b1e08" />
            <rect x="160" y="35" width="4" height="95" fill="#3b1e08" />
            <polygon points="117,12 145,18 117,25" fill="#7f1d1d" />
            <path d="M 45 40 Q 75 55 67 105 L 40 100 Q 52 70 45 40 Z" fill="#1f2937" />
            <path d="M 85 28 Q 135 50 118 110 L 80 105 Q 98 68 85 28 Z" fill="#0f172a" />
            <path d="M 140 45 Q 175 62 162 108 L 136 104 Q 148 75 140 45 Z" fill="#1f2937" />
            <circle cx="104" cy="65" r="7" fill="#e2e8f0" />
            <circle cx="101" cy="64" r="1.8" fill="#0f172a" />
            <circle cx="107" cy="64" r="1.8" fill="#0f172a" />
            <path d="M 20 120 L 195 120 L 175 155 Q 110 165 40 155 Z" fill="#4a2511" />
            <circle cx="75" cy="136" r="3.5" fill="#0f172a" />
            <circle cx="105" cy="137" r="3.5" fill="#0f172a" />
            <circle cx="135" cy="137" r="3.5" fill="#0f172a" />
          </g>
        </svg>
      </div>
    </div>

    <!-- Barco Pirata 3 (más lejano en el horizonte) -->
    <div class="pirate-ship ship-3">
      <div class="ship-bob">
        <svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
          <rect x="70" y="30" width="4" height="95" fill="#1e293b" />
          <rect x="115" y="18" width="4" height="107" fill="#1e293b" />
          <path d="M 50 42 Q 80 58 72 105 L 48 100 Z" fill="#0f172a" />
          <path d="M 90 30 Q 135 52 120 108 L 86 104 Z" fill="#0f172a" />
          <path d="M 25 120 L 185 120 L 165 150 Q 105 158 45 150 Z" fill="#1e293b" />
        </svg>
      </div>
    </div>

    <!-- Olas del mar animadas -->
    <div class="wave wave-back"></div>
    <div class="wave wave-mid"></div>
    <div class="wave wave-front"></div>
  </div>

  <!-- Tarjeta principal centrada -->
  <main class="container">
    <h1>Elige tu destino</h1>
    <p class="subtitle">Haz clic en el botón rojo o en el botón azul para descubrir tu suerte.</p>

    <div class="buttons-container">
      <button id="btn-red" class="destiny-btn btn-red" type="button" onclick="chooseDestiny('rojo')">
        Botón Rojo
      </button>
      <button id="btn-blue" class="destiny-btn btn-blue" type="button" onclick="chooseDestiny('azul')">
        Botón Azul
      </button>
    </div>

    <div id="result-area" class="result-area hidden" aria-live="polite">
      <p id="result-message" class="result-message"></p>
      <button id="play-again-btn" class="play-again-btn" type="button" onclick="resetGame()">
        Volver a jugar
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
